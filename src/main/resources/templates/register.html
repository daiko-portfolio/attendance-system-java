<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>出欠登録</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main>

<h1>出欠登録</h1>

<form action="/register" method="get">
    教室：
    <select name="class_id" required>
        <option value="">選択してください</option>
        <option
            th:each="classItem : ${classes}"
            th:value="${classItem.classId}"
            th:text="${classItem.className}"
            th:selected="${selectedClassId != null and selectedClassId == classItem.classId.toString()}"
        ></option>
    </select>

    日付：
    <input type="date" name="date" th:value="${selectedDate}" required>

    区分：
    <select name="check_no" required>
        <option value="1" th:selected="${selectedCheckNo == '1'}">午前</option>
        <option value="2" th:selected="${selectedCheckNo == '2'}">午後</option>
    </select>

    <button type="submit" class="btn btn-search">表示</button>
</form>

<br>

<form th:if="${!persons.isEmpty()}" action="/attendance/submit" method="post">

    <input type="hidden" name="class_id" th:value="${selectedClassId}">
    <input type="hidden" name="attendance_date" th:value="${selectedDate}">
    <input type="hidden" name="check_no" th:value="${selectedCheckNo}">

    <p>
        日付：<span th:text="${selectedDate}"></span>
        ／区分：<span th:if="${selectedCheckNo == '1'}">午前</span><span th:unless="${selectedCheckNo == '1'}">午後</span>
        ／授業属性：
        <select name="lesson_type" required>
            <option value="学科" th:selected="${selectedLessonType == '学科'}">学科</option>
            <option value="実技" th:selected="${selectedLessonType == '実技'}">実技</option>
        </select>
    </p>

    <!-- スケジュール登録済みの日は、授業予定を参考情報として表示する -->
    <p th:if="${scheduleInfo != null and scheduleInfo.status == '通常'}" style="color: #1a5276;">
        授業予定：<span th:text="${scheduleInfo.teacherName} + ' / ' + ${scheduleInfo.roomName} + ' / ' + ${scheduleInfo.lessonType}"></span>
        <span th:if="${scheduleInfo.memo != null and !scheduleInfo.memo.isEmpty()}"
              th:text="'（メモ: ' + ${scheduleInfo.memo} + '）'"></span>
    </p>

    <p th:if="${scheduleInfo != null and scheduleInfo.status == '休み'}" style="color: #c0392b; font-weight: bold;">
        ※この日はスケジュール上「休み」として登録されています
        <span th:if="${scheduleInfo.memo != null and !scheduleInfo.memo.isEmpty()}"
              th:text="'（メモ: ' + ${scheduleInfo.memo} + '）'"></span>
    </p>

    <p th:if="${scheduleInfo == null}" style="color: #999;">
        この日の授業スケジュールは未登録です
    </p>

    <h2 th:text="${className}"></h2>

    <table>
        <tr>
            <th>出席番号</th>
            <th>名前</th>
            <th>出席時間</th>
        </tr>

        <tr th:each="person : ${persons}">
            <td th:text="${person.attendanceNo}"></td>
            <td th:text="${person.name}"></td>

            <!--
              th:with は「この<td>の中だけで使える変数」を定義するThymeleafの機能。
                hasData  … この生徒の出欠が登録済みかどうか（currentHoursというMapにキーがあるか）
                curHours … 登録済みの出席時間（未登録ならnull）
              毎回 currentHours.get(...) を書かずに済むよう、先に短い名前を付けている。

              ラジオボタンのname属性は "attended_hours_生徒ID" という動的な名前にしていて、
              Controller側では前方一致（attended_hours_で始まるか）で拾い出す仕組み。
            -->
            <td th:with="hasData=${currentHours.containsKey(person.personId)}, curHours=${currentHours.get(person.personId)}">
                <label class="radio-btn radio-present">
                    <!-- 「全出席」の初期選択条件：未登録なら初期値として選択、登録済みなら保存値が3の時だけ選択 -->
                    <input
                        type="radio"
                        th:name="${'attended_hours_' + person.personId}"
                        value="3"
                        th:checked="${!hasData or curHours == 3}"
                    >
                    <span>全出席</span>
                </label>

                <label class="radio-btn radio-warning">
                    <input
                        type="radio"
                        th:name="${'attended_hours_' + person.personId}"
                        value="2"
                        th:checked="${curHours == 2}"
                    >
                    <span>2h</span>
                </label>

                <label class="radio-btn radio-warning">
                    <input
                        type="radio"
                        th:name="${'attended_hours_' + person.personId}"
                        value="1"
                        th:checked="${curHours == 1}"
                    >
                    <span>1h</span>
                </label>

                <label class="radio-btn radio-absent">
                    <input
                        type="radio"
                        th:name="${'attended_hours_' + person.personId}"
                        value="0"
                        th:checked="${curHours == 0}"
                    >
                    <span>欠席</span>
                </label>
            </td>
        </tr>
    </table>

    <br>

    <button type="submit" class="btn btn-create">一括登録</button>

</form>

<br>

<a href="/">メニューへ戻る</a>

</main>

</body>

</html>
