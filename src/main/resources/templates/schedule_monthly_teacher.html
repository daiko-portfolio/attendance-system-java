<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>スケジュール月次（教師別）</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        /* カレンダー専用の最低限のスタイル（教室別画面と同じスタイル） */
        .cal-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }
        .cal-table th {
            background-color: #2c3e50;
            color: #fff;
            padding: 8px;
            font-size: 15px;
        }
        .cal-table td {
            border: 1px solid #ccc;
            vertical-align: top;
            height: 100px;
            padding: 6px;
            font-size: 14px;
        }
        .cal-out {
            background-color: #fafafa;
            color: #bbb;
        }
        .cal-weekend {
            background-color: #f3eefb;
        }
        .cal-today {
            outline: 2px solid #2980b9;
            outline-offset: -2px;
        }
        .cal-day-num {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 3px;
        }
        .cal-slot {
            margin-top: 2px;
            line-height: 1.3;
        }
        .cal-am {
            color: #1a5276;
        }
        .cal-pm {
            color: #7d5a00;
        }
        .cal-holiday {
            color: #999;
        }
        /* 補講：教室別画面と揃えた緑系にする */
        .cal-makeup {
            color: #1e8449;
        }
        .cal-memo {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            color: #b9770e;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main>

<h1>スケジュール月次（教師別）</h1>

<!-- 教師と月の絞り込み -->
<form action="/schedule/monthly/teacher" method="get">
    教師：
    <select name="teacher_id" required>
        <option value="">選択してください</option>
        <option
            th:each="teacherItem : ${teachers}"
            th:value="${teacherItem.teacherId}"
            th:text="${teacherItem.teacherName}"
            th:selected="${selectedTeacherId != null and selectedTeacherId == teacherItem.teacherId.toString()}"
        ></option>
    </select>

    月：
    <input type="month" name="month" th:value="${selectedMonth}" required>

    <button type="submit" class="btn btn-search">表示</button>
</form>

<br>

<!-- 教師が選ばれてカレンダーが組み立てられた時だけ表示 -->
<div th:if="${weeks != null}">

    <h2 th:text="${teacherName} + ' 先生'"></h2>

    <table class="cal-table">
        <tr>
            <th>月</th>
            <th>火</th>
            <th>水</th>
            <th>木</th>
            <th>金</th>
            <th>土</th>
            <th>日</th>
        </tr>

        <tr th:each="week : ${weeks}">
            <td th:each="day : ${week}"
                th:classappend="${day.cellClass()}">

                <div class="cal-day-num" th:text="${day.dayOfMonth}"></div>

                <!-- 午前：この教師が担当する授業がある時だけ表示される。
                     休講(cancelled)は「休み」と違って教師の予定として残っているため、この教師の画面にも
                     本来の予定（クラス/場所/属性）が「【休講】」付きで表示される -->
                <div class="cal-slot cal-am" th:if="${day.am.registered}">
                    <span th:if="${day.am.cancelled}" class="cal-cancelled"
                          th:text="'AM: 【休講】' + ${day.am.className} + '/' + ${day.am.roomName} + ' ' + ${day.am.lessonType}"></span>
                    <span th:unless="${day.am.cancelled}"
                          th:text="'AM: ' + ${day.am.className} + '/' + ${day.am.roomName} + ' ' + ${day.am.lessonType}"></span>
                    <div class="cal-memo"
                         th:if="${day.am.memo != null and !day.am.memo.isEmpty()}"
                         th:title="${day.am.memo}"
                         th:text="'メモ: ' + ${day.am.memo}"></div>
                </div>

                <!-- 午後：この教師が担当する授業がある時だけ表示される -->
                <div class="cal-slot cal-pm" th:if="${day.pm.registered}">
                    <span th:if="${day.pm.cancelled}" class="cal-cancelled"
                          th:text="'PM: 【休講】' + ${day.pm.className} + '/' + ${day.pm.roomName} + ' ' + ${day.pm.lessonType}"></span>
                    <span th:unless="${day.pm.cancelled}"
                          th:text="'PM: ' + ${day.pm.className} + '/' + ${day.pm.roomName} + ' ' + ${day.pm.lessonType}"></span>
                    <div class="cal-memo"
                         th:if="${day.pm.memo != null and !day.pm.memo.isEmpty()}"
                         th:title="${day.pm.memo}"
                         th:text="'メモ: ' + ${day.pm.memo}"></div>
                </div>

                <!-- 補講（放課後）：この教師が担当する補講がある時だけ、午前午後の下に追加表示する -->
                <div class="cal-slot cal-makeup" th:if="${day.makeup.registered}">
                    <span th:text="'補講: ' + ${day.makeup.className} + '/' + ${day.makeup.roomName} + ' ' + ${day.makeup.lessonType}"></span>
                    <div class="cal-memo"
                         th:if="${day.makeup.memo != null and !day.makeup.memo.isEmpty()}"
                         th:title="${day.makeup.memo}"
                         th:text="'メモ: ' + ${day.makeup.memo}"></div>
                </div>

            </td>
        </tr>
    </table>

</div>

<br>

<a href="/">メニューへ戻る</a>

</main>

</body>

</html>
