<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>新教室作成</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main>

<h1>新教室作成</h1>

<!-- 作成に失敗した場合のメッセージ（成功時は教室管理画面へ移動してそちらに表示される） -->
<div class="error-box" th:if="${errorMessage != null}" th:text="${errorMessage}"></div>

<form action="/class/create/submit" method="post">

    <p>
        教室名：
        <input type="text" name="class_name" required>
    </p>

    <p>
        開始日：
        <input type="date" name="start_date" required>
    </p>

    <p>
        終了日：
        <input type="date" name="end_date" required>
    </p>

    <p>
        必要時間（学科）：
        <input type="number" name="required_academic_hours" min="0" value="0">h
    </p>

    <p>
        必要時間（実技）：
        <input type="number" name="required_practical_hours" min="0" value="0">h
    </p>

    <h2>生徒一覧</h2>

    <table>
        <tr>
            <th>出席番号</th>
            <th>名前</th>
        </tr>

        <tr th:each="i : ${#numbers.sequence(1, 20)}">
            <td th:text="${i}"></td>
            <td>
                <input type="text" th:name="${'name_' + i}">
            </td>
        </tr>
    </table>

    <br>

    <button type="submit" class="btn btn-create">
        教室と生徒を一括登録
    </button>

</form>

<br>

<a href="/">メニューへ戻る</a>

</main>

</body>

</html>
