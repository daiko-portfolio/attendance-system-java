<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>出欠時間分析</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main>

<h1>出欠時間分析</h1>

<form action="/summary" method="get">
    教室：
    <select name="class_id" required>
        <option value="">選択してください</option>
        <option
            th:each="classItem : ${classes}"
            th:value="${classItem.classId}"
            th:text="${classItem.className}"
            th:selected="${selectedClassId != null and selectedClassId == classItem.classId.toString()}"
        ></option>
    </select>

    開始日：
    <input type="date" name="start_date" th:value="${startDate}">

    終了日：
    <input type="date" name="end_date" th:value="${endDate}">

    <button type="submit" class="btn btn-search">表示</button>
</form>

<br>

<!--
  コース進捗（必要時間に対する実施率）。期間の絞り込み（開始日・終了日）とは無関係に、
  そのクラスの開始からの累計で計算している（monthly.htmlのsummary-box/summary-cardを流用）。
-->
<div class="summary-box" th:if="${courseProgress != null}">
    <h2>コース進捗</h2>

    <div class="summary-grid">
        <div class="summary-card">
            <h3>総合</h3>
            実施：<span th:text="${courseProgress.totalDone}"></span>h
            / 必要：<span th:text="${courseProgress.totalRequired}"></span>h<br>
            消化率：<span th:text="${courseProgress.totalRate}"></span>%
        </div>

        <div class="summary-card">
            <h3>学科</h3>
            実施：<span th:text="${courseProgress.academicDone}"></span>h
            / 必要：<span th:text="${courseProgress.academicRequired}"></span>h<br>
            消化率：<span th:text="${courseProgress.academicRate}"></span>%
        </div>

        <div class="summary-card">
            <h3>実技</h3>
            実施：<span th:text="${courseProgress.practicalDone}"></span>h
            / 必要：<span th:text="${courseProgress.practicalRequired}"></span>h<br>
            消化率：<span th:text="${courseProgress.practicalRate}"></span>%
        </div>
    </div>
</div>

<br>

<table th:if="${!rows.isEmpty()}">
    <tr>
        <th>出席番号</th>
        <th>名前</th>
        <th>総合</th>
        <th>学科</th>
        <th>実技</th>
        <th>判定</th>
    </tr>

    <tr th:each="row : ${rows}">
        <td th:text="${row.attendanceNo}"></td>
        <td th:text="${row.name}"></td>

        <td>
            出席：<span th:text="${row.totalAttended}"></span>h<br>
            欠席：<span th:text="${row.totalAbsent}"></span>h<br>
            最大：<span th:text="${row.totalMax}"></span>h<br>
            率：<span th:text="${row.totalRate}"></span>%
        </td>

        <td>
            出席：<span th:text="${row.academicAttended}"></span>h<br>
            欠席：<span th:text="${row.academicAbsent}"></span>h<br>
            最大：<span th:text="${row.academicMax}"></span>h<br>
            率：<span th:text="${row.academicRate}"></span>%
        </td>

        <td>
            出席：<span th:text="${row.practicalAttended}"></span>h<br>
            欠席：<span th:text="${row.practicalAbsent}"></span>h<br>
            最大：<span th:text="${row.practicalMax}"></span>h<br>
            率：<span th:text="${row.practicalRate}"></span>%
        </td>

        <!--
          判定（安全/注意/危険）の色分けは、Java側（SummaryRow.judgeClass()）で
          判定文字列→CSSクラス名に変換済みのものを、固定文字列 'judge-line ' に連結しているだけ。
        -->
        <td class="judge-cell">
            <div th:class="'judge-line ' + ${row.judgeClass(row.totalJudge)}">
                総合：<span th:text="${row.totalJudge}"></span>
            </div>

            <div th:class="'judge-line ' + ${row.judgeClass(row.academicJudge)}">
                学科：<span th:text="${row.academicJudge}"></span>
            </div>

            <div th:class="'judge-line ' + ${row.judgeClass(row.practicalJudge)}">
                実技：<span th:text="${row.practicalJudge}"></span>
            </div>
        </td>
    </tr>
</table>

<p th:if="${rows.isEmpty() and selectedClassId != null and !selectedClassId.isBlank()}">
    この条件の出欠データはありません。
</p>

</main>

</body>

</html>
