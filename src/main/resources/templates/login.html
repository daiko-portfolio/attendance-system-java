<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ログイン</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<main>

<div class="menu-container">

    <h1>ログイン</h1>

    <p th:if="${errorMessage}" style="color:#e74c3c; font-weight:bold;" th:text="${errorMessage}"></p>

    <form action="/login" method="post">

        <p>
            ユーザー名：
            <input type="text" name="username" required autofocus>
        </p>

        <p>
            パスワード：
            <input type="password" name="password" required>
        </p>

        <button type="submit" class="btn btn-create">
            ログイン
        </button>

    </form>

    <div class="admin-section">
        <p class="menu-section-title">デモ用ログイン情報</p>
        <p>ポートフォリオ確認用の固定アカウントです。自由にお使いください。</p>
        <table>
            <tr>
                <th>権限</th>
                <th>ユーザー名</th>
                <th>パスワード</th>
            </tr>
            <tr>
                <td>管理者</td>
                <td>admin</td>
                <td>AdminDemo2026!</td>
            </tr>
            <tr>
                <td>教師（田中）</td>
                <td>teacher1</td>
                <td>TeacherDemo2026!</td>
            </tr>
            <tr>
                <td>生徒（吉田）</td>
                <td>student1</td>
                <td>StudentDemo2026!</td>
            </tr>
        </table>
    </div>

</div>

</main>

</body>

</html>
