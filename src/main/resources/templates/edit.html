<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>出欠編集・削除</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<header class="site-header">
    <a class="nav-link nav-home" href="/">メニュー</a>
    <a class="nav-link nav-create" href="/register">出欠登録</a>
    <a class="nav-link nav-view" href="/list">出欠一覧</a>
    <a class="nav-link nav-view" href="/monthly">月次表</a>
    <a class="nav-link nav-view" href="/summary">出席率</a>
    <a class="nav-link nav-update" href="/edit">出欠編集</a>
    <a class="nav-link nav-create" href="/class/create">新教室作成</a>
    <a class="nav-link nav-update" href="/classes">教室管理</a>
    <a class="nav-link nav-update" href="/persons">生徒管理</a>
</header>

<main>

<h1>出欠編集・削除</h1>

<form action="/edit" method="get">

    日付：
    <input type="date" name="date" th:value="${searchDate != null ? searchDate : today}" required>

    教室：
    <select name="class_id" required>
        <option value="">選択してください</option>
        <option
            th:each="classItem : ${classes}"
            th:value="${classItem.classId}"
            th:text="${classItem.className}"
            th:selected="${selectedClassId != null and selectedClassId == classItem.classId.toString()}"
        ></option>
    </select>

    区分：
    <select name="check_no" required>
        <option value="1" th:selected="${checkNo == '1'}">午前</option>
        <option value="2" th:selected="${checkNo == '2'}">午後</option>
    </select>

    <button type="submit" class="btn btn-search">表示</button>

</form>

<br>

<form th:if="${!rows.isEmpty()}" action="/attendance/update" method="post">

    <input type="hidden" name="attendance_date" th:value="${searchDate}">
    <input type="hidden" name="check_no" th:value="${checkNo}">
    <input type="hidden" name="class_id" th:value="${selectedClassId}">

    <p>
        授業属性：
        <select name="lesson_type" required>
            <option value="学科" th:selected="${currentLessonType == '学科'}">学科</option>
            <option value="実技" th:selected="${currentLessonType == '実技'}">実技</option>
        </select>
    </p>

    <table>
        <tr>
            <th>出席番号</th>
            <th>名前</th>
            <th>現在</th>
            <th>出席時間</th>
        </tr>

        <tr th:each="row : ${rows}">
            <td th:text="${row.attendanceNo}"></td>
            <td th:text="${row.name}"></td>

            <td th:class="${row.attendedHours == 3} ? 'status-present' : (${row.attendedHours == 0} ? 'status-absent' : (${row.attendedHours != null} ? 'status-warning' : 'status-none'))">
                <span th:text="${row.lessonType}"></span><br>
                <span th:text="${row.attendedHours} + 'h'"></span>
            </td>

            <td>
                <label class="radio-btn radio-present">
                    <input type="radio" th:name="${'attended_hours_' + row.personId}" value="3" th:checked="${row.attendedHours == 3}">
                    <span>全出席</span>
                </label>

                <label class="radio-btn radio-warning">
                    <input type="radio" th:name="${'attended_hours_' + row.personId}" value="2" th:checked="${row.attendedHours == 2}">
                    <span>2h</span>
                </label>

                <label class="radio-btn radio-warning">
                    <input type="radio" th:name="${'attended_hours_' + row.personId}" value="1" th:checked="${row.attendedHours == 1}">
                    <span>1h</span>
                </label>

                <label class="radio-btn radio-absent">
                    <input type="radio" th:name="${'attended_hours_' + row.personId}" value="0" th:checked="${row.attendedHours == 0}">
                    <span>欠席</span>
                </label>
            </td>
        </tr>
    </table>

    <br>

    <button type="submit" class="btn btn-update">一括更新</button>

</form>

<br>

<form
    th:if="${!rows.isEmpty()}"
    action="/attendance/delete"
    method="post"
    onsubmit="return confirm('この教室・日付・区分の出欠を削除します。よろしいですか？');"
>
    <input type="hidden" name="attendance_date" th:value="${searchDate}">
    <input type="hidden" name="check_no" th:value="${checkNo}">
    <input type="hidden" name="class_id" th:value="${selectedClassId}">

    <button type="submit" class="btn btn-delete">一括削除</button>
</form>

<br>

<a href="/">メニューへ戻る</a>

</main>

</body>

</html>
