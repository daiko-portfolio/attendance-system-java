<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>出欠一覧</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main>

<h1>出欠一覧</h1>

<form action="/list" method="get">
    日付：
    <input type="date" name="date" th:value="${searchDate}">

    教室：
    <select name="class_id">
        <option value="">全教室</option>
        <option
            th:each="classItem : ${classes}"
            th:value="${classItem.classId}"
            th:text="${classItem.className}"
            th:selected="${selectedClassId != null and selectedClassId == classItem.classId.toString()}"
        ></option>
    </select>

    名前：
    <input type="text" name="name" th:value="${searchName}">

    <button type="submit" class="btn btn-search">検索</button>

    <!-- CSV出力は未実装（README「今後の追加予定」参照）。実装するまでリンクは出さない -->

    <a href="/list">全件表示</a>
</form>

<br>

<table>
    <tr>
        <th>教室</th>
        <th>出席番号</th>
        <th>名前</th>
        <th>日付</th>
        <th>午前</th>
        <th>午後</th>
        <th th:if="${hasMakeupData}">補講</th>
    </tr>

    <tr th:each="row : ${rows}">
        <td th:text="${row.className}"></td>
        <td th:text="${row.attendanceNo}"></td>
        <td th:text="${row.name}"></td>
        <td th:text="${row.attendanceDate}"></td>

        <!-- 午前 -->
        <td th:class="${row.statusClass(row.morningHours)}">
            <span th:if="${row.morningHours != null}">
                <span th:text="${row.morningLessonType}"></span><br>
                <span th:text="${row.morningHours} + 'h'"></span>
            </span>
            <span th:unless="${row.morningHours != null}">未登録</span>
        </td>

        <!-- 午後 -->
        <td th:class="${row.statusClass(row.afternoonHours)}">
            <span th:if="${row.afternoonHours != null}">
                <span th:text="${row.afternoonLessonType}"></span><br>
                <span th:text="${row.afternoonHours} + 'h'"></span>
            </span>
            <span th:unless="${row.afternoonHours != null}">未登録</span>
        </td>

        <!-- 補講：検索結果に1件も無ければ列自体が出ないので、この<td>もth:ifの外の<th>と対になる -->
        <td th:if="${hasMakeupData}" th:class="${row.statusClass(row.makeupHours)}">
            <span th:if="${row.makeupHours != null}">
                <span th:text="${row.makeupLessonType}"></span><br>
                <span th:text="${row.makeupHours} + 'h'"></span>
            </span>
            <span th:unless="${row.makeupHours != null}">未登録</span>
        </td>

    </tr>
</table>

</main>

</body>

</html>
