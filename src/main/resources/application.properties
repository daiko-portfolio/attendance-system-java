spring.application.name=attendance-system-java
spring.datasource.url=jdbc:sqlite:./data/attendance.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLiteは接続（コネクション）ごとに外部キー制約が既定でOFFになっているため、
# HikariCP（接続プール）が新しい物理接続を作るたびに、このSQLを1回実行させて有効化する。
# C#のADO.NETで言う「コネクションファクトリーで開いた直後にPRAGMAを実行する」のと同じ考え方。
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON
